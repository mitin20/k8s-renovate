---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
spec:
  selector:
    matchLabels:
      app: wordpress
  replicas: 1
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          image: wordpress@sha256:2cdd03ba797832ae650c9f986dd987996832bc1f98b079fe2ceca984990d1c98

          ports:
            - containerPort: 80
