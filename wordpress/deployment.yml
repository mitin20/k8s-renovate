---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
spec:
  selector:
    matchLabels:
      app: wordpress
  replicas: 1
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          image: wordpress@sha256:fe2f14897f8f46d61d452139aaa5c9359c277256dda69810c96509ad32f273d5

          ports:
            - containerPort: 80
